<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="526" viewBox="0 0 1000 526" role="img" aria-label="Dark features: giveaways, moderation, tickets, progression, music and automations"><title>Dark features: giveaways, moderation, tickets, progression, music and automations</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#151022"/><stop offset="1" stop-color="#0b0b11"/></linearGradient><linearGradient id="accent"><stop stop-color="#b29aff"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><radialGradient id="glow"><stop stop-color="#7c3aed" stop-opacity=".25"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}.float{animation:float 7s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.float,.pulse{animation:none}}</style><rect x="1" y="1" width="998" height="524" rx="24" fill="url(#bg)" stroke="#292338"/><g><rect x="17" y="17" width="475" height="149" rx="17" fill="#121019" stroke="#292338"/><g transform="translate(39 39)" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11H28V17H4ZM7 17V29H25V17M16 11V29M16 11C5 11 7 1 12 5ZM16 11C27 11 25 1 20 5Z"/></g><text x="87" y="60" font-size="18" fill="#f4f1ff" font-weight="650">Give a little. Grow a lot.</text><text x="41" y="105" font-size="15" fill="#a6a0ba" >Conditional giveaways, winner selection,</text><text x="41" y="128" font-size="15" fill="#a6a0ba" >and automatic reward delivery.</text></g><g><rect x="508" y="17" width="475" height="149" rx="17" fill="#121019" stroke="#292338"/><g transform="translate(530 39)" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3L28 8V17Q27 25 16 30Q5 25 4 17V8ZM10 16L14 20L22 12"/></g><text x="578" y="60" font-size="18" fill="#f4f1ff" font-weight="650">Keep the good energy.</text><text x="532" y="105" font-size="15" fill="#a6a0ba" >AutoMod, server guard, moderation,</text><text x="532" y="128" font-size="15" fill="#a6a0ba" >and the logs your team needs.</text></g><g><rect x="17" y="181" width="475" height="149" rx="17" fill="#121019" stroke="#292338"/><g transform="translate(39 203)" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7H28V13Q21 16 28 19V25H4V19Q11 16 4 13ZM19 9V12M19 15V18M19 21V23"/></g><text x="87" y="224" font-size="18" fill="#f4f1ff" font-weight="650">Support, without the chaos.</text><text x="41" y="269" font-size="15" fill="#a6a0ba" >Organize member requests with tickets</text><text x="41" y="292" font-size="15" fill="#a6a0ba" >and manage them from the dashboard.</text></g><g><rect x="508" y="181" width="475" height="149" rx="17" fill="#121019" stroke="#292338"/><g transform="translate(530 203)" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2L20 12L30 15L20 18L17 29L14 18L4 15L14 12ZM4 3V7M2 5H6"/></g><text x="578" y="224" font-size="18" fill="#f4f1ff" font-weight="650">Give members a reason to stay.</text><text x="532" y="269" font-size="15" fill="#a6a0ba" >Levels, economy, profiles,</text><text x="532" y="292" font-size="15" fill="#a6a0ba" >and community leaderboards.</text></g><g><rect x="17" y="345" width="475" height="149" rx="17" fill="#121019" stroke="#292338"/><g transform="translate(39 367)" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V16A11 11 0 0 1 27 16V25H22V17H27M5 17H10V25H5ZM22 26Q22 30 16 30"/></g><text x="87" y="388" font-size="18" fill="#f4f1ff" font-weight="650">Bring your voice channels to life.</text><text x="41" y="433" font-size="15" fill="#a6a0ba" >Music sessions and queues,</text><text x="41" y="456" font-size="15" fill="#a6a0ba" >with controls on the web dashboard.</text></g><g><rect x="508" y="345" width="475" height="149" rx="17" fill="#121019" stroke="#292338"/><g transform="translate(530 367)" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="2" width="8" height="8" rx="2"/><rect x="2" y="22" width="8" height="8" rx="2"/><rect x="22" y="22" width="8" height="8" rx="2"/><path d="M16 10V16H6V22M16 16H26V22"/></g><text x="578" y="388" font-size="18" fill="#f4f1ff" font-weight="650">Let the routine run itself.</text><text x="532" y="433" font-size="15" fill="#a6a0ba" >Welcome flows, roles, notifications,</text><text x="532" y="456" font-size="15" fill="#a6a0ba" >and everyday server automations.</text></g></svg>