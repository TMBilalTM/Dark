<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-label="Dark: giveaways, moderation, support, levels, music and automations"><title>Dark: giveaways, moderation, support, levels, music and automations</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080e18"/><stop offset=".6" stop-color="#0c1422"/><stop offset="1" stop-color="#080d15"/></linearGradient><linearGradient id="gold"><stop stop-color="#f9dfac"/><stop offset=".55" stop-color="#e8b46b"/><stop offset="1" stop-color="#bc8640"/></linearGradient><linearGradient id="line"><stop stop-color="#bb8e4a" stop-opacity="0"/><stop offset=".5" stop-color="#bb8e4a" stop-opacity=".6"/><stop offset="1" stop-color="#bb8e4a" stop-opacity="0"/></linearGradient><radialGradient id="halo"><stop stop-color="#94703a" stop-opacity=".12"/><stop offset="1" stop-color="#94703a" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.dust{animation:dust 5s ease-in-out infinite}@keyframes dust{0%,100%{opacity:.2}50%{opacity:.75}}@media(prefers-reduced-motion:reduce){.dust{animation:none}}</style><rect width="1000" height="540" rx="8" fill="url(#bg)"/><ellipse cx="500" cy="10" rx="480" ry="240" fill="url(#halo)"/><text x="500" y="61" font-size="30" fill="#f2eadb" text-anchor="middle" font-weight="650" letter-spacing="-.6">A better experience, from the first hello.</text><text x="500" y="94" font-size="15" fill="#9faabd" text-anchor="middle">Built around the things your community does every day.</text><text x="50" y="154" font-size="11" fill="#e9b76b" letter-spacing="2">01</text><text x="90" y="155" font-size="21" fill="#f2eadb" font-weight="650">Giveaways</text><text x="90" y="185" font-size="15" fill="#9faabd" >Entry conditions, winner selection,</text><text x="90" y="208" font-size="15" fill="#9faabd" >and supported reward delivery.</text><path d="M90 237H460" stroke="url(#line)"/><text x="530" y="154" font-size="11" fill="#e9b76b" letter-spacing="2">02</text><text x="570" y="155" font-size="21" fill="#f2eadb" font-weight="650">Moderation &amp; guard</text><text x="570" y="185" font-size="15" fill="#9faabd" >AutoMod, protection, and clear logs</text><text x="570" y="208" font-size="15" fill="#9faabd" >for the people keeping things running.</text><path d="M570 237H940" stroke="url(#line)"/><text x="50" y="279" font-size="11" fill="#e9b76b" letter-spacing="2">03</text><text x="90" y="280" font-size="21" fill="#f2eadb" font-weight="650">Tickets &amp; support</text><text x="90" y="310" font-size="15" fill="#9faabd" >A place for every question.</text><text x="90" y="333" font-size="15" fill="#9faabd" >A clear workflow for your team.</text><path d="M90 362H460" stroke="url(#line)"/><text x="530" y="279" font-size="11" fill="#e9b76b" letter-spacing="2">04</text><text x="570" y="280" font-size="21" fill="#f2eadb" font-weight="650">Levels &amp; economy</text><text x="570" y="310" font-size="15" fill="#9faabd" >Profiles, progression, and leaderboards</text><text x="570" y="333" font-size="15" fill="#9faabd" >that give members something to return to.</text><path d="M570 362H940" stroke="url(#line)"/><text x="50" y="404" font-size="11" fill="#e9b76b" letter-spacing="2">05</text><text x="90" y="405" font-size="21" fill="#f2eadb" font-weight="650">Music</text><text x="90" y="435" font-size="15" fill="#9faabd" >Bring your voice channels together</text><text x="90" y="458" font-size="15" fill="#9faabd" >with queues and dashboard controls.</text><text x="530" y="404" font-size="11" fill="#e9b76b" letter-spacing="2">06</text><text x="570" y="405" font-size="21" fill="#f2eadb" font-weight="650">Server automations</text><text x="570" y="435" font-size="15" fill="#9faabd" >Welcome flows, roles, notifications,</text><text x="570" y="458" font-size="15" fill="#9faabd" >and the routines behind the scenes.</text><circle class="dust" cx="36" cy="62" r="1.1" fill="#edc788"/><circle class="dust" cx="970" cy="92" r="1.1" fill="#edc788"/><circle class="dust" cx="24" cy="488" r="1.1" fill="#edc788"/><circle class="dust" cx="948" cy="505" r="1.1" fill="#edc788"/><circle class="dust" cx="498" cy="460" r="1.1" fill="#edc788"/><circle class="dust" cx="936" cy="295" r="1.1" fill="#edc788"/></svg>