<svg xmlns="http://www.w3.org/2000/svg" width="228" height="50" viewBox="0 0 228 50" role="img" aria-label="Join support"><title>Join support</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#151022"/><stop offset="1" stop-color="#0b0b11"/></linearGradient><linearGradient id="accent"><stop stop-color="#b29aff"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><radialGradient id="glow"><stop stop-color="#7c3aed" stop-opacity=".25"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}.float{animation:float 7s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.float,.pulse{animation:none}}</style><rect x="1" y="1" width="226" height="48" rx="24" fill="url(#bg)" stroke="#292338"/><rect x="1" y="1" width="226" height="48" rx="12" fill="#181322" stroke="#443553"/><text x="114" y="31" font-size="15" fill="#ffffff" font-weight="650" text-anchor="middle">Join support  ↗</text></svg>